<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSL Management Console</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .app-body {
            display: flex;
            height: 100vh;
        }

        /* Left Pane */
        #form-pane {
            width: 380px;
            min-width: 320px;
            background: #fff;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        #form-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.75);
            display: none;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #form-overlay.active {
            display: flex;
        }

        .spinner-border {
            width: 3rem;
            height: 3rem;
            color: #003366;
        }

        #form-overlay p {
            margin-top: 15px;
            font-weight: bold;
            color: #003366;
        }

        .action-tabs .nav-link {
            color: #003366;
            border-radius: 0;
        }

        .action-tabs .nav-link.active {
            background-color: #003366;
            color: #fff;
            border-color: #003366;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-control {
            font-size: 0.9rem;
        }

        #submit-btn {
            background-color: #003366;
            border-color: #003366;
            color: #fff;
            width: 100%;
            margin-top: auto;
        }

        #submit-btn:hover:not(:disabled) {
            background-color: #002244;
            border-color: #002244;
        }

        #submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* Right Pane */
        #output-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }

        #output-pane h5 {
            font-weight: 700;
            color: #003366;
            margin-bottom: 10px;
        }

        #output-area {
            flex: 1;
            font-family: monospace;
            font-size: 0.85rem;
            resize: none;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: none;
            border-radius: 4px;
            padding: 15px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        #status-badge {
            font-size: 0.85rem;
            padding: 4px 10px;
        }

        #clear-btn {
            font-size: 0.8rem;
        }

        .fas.fa-info-circle {
            color: #6c757d;
            font-size: 0.85rem;
        }

        #token-group {
            margin-bottom: 20px;
            padding-bottom: 15px;
            padding-top: 8px;
            border-bottom: 1px solid #dee2e6;
        }
    </style>
</head>
<body>

    <div class="app-body">

        <!-- Left Pane: Form -->
        <div id="form-pane">
            <div id="form-overlay">
                <div class="spinner-border" role="status"></div>
                <p id="overlay-message">Running...</p>
            </div>

            <!-- NetBox Token -->
            <div id="token-group">
                <div class="form-group mb-0">
                    <label for="netbox-token">
                        <i class="fas fa-key"></i> NetBox API Token
                    </label>
                    <input type="password" class="form-control" id="netbox-token" placeholder="Enter your NetBox API token" required>
                </div>
            </div>

            <!-- Action Tabs -->
                    <ul class="nav nav-tabs action-tabs mb-3" id="action-tabs">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" data-action="build">CSR</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-action="show">Show</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-action="import">Import</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-action="selfsign">Self-Sign</a>
                        </li>
                    </ul>

            <!-- Common Name (all actions) -->
            <div class="form-group">
                <label for="common-name">
                    Common Name
                    <i class="fas fa-info-circle" data-toggle="tooltip" title="The FQDN for the SSL certificate e.g. myapp.example.com"></i>
                </label>
                <input type="text" class="form-control" id="common-name" placeholder="myapp.example.com" required>
            </div>

            <!-- Build Fields -->
            <div id="build-fields">
                <div class="form-group">
                    <label for="owner-group">
                        Owner Group
                        <i class="fas fa-info-circle" data-toggle="tooltip" title="Team or department responsible for this certificate."></i>
                    </label>
                    <input type="text" class="form-control" id="owner-group" placeholder="network-engineering">
                </div>
                <div class="form-group">
                    <label for="reference-number">
                        Reference Number
                        <i class="fas fa-info-circle" data-toggle="tooltip" title="Optional IDM reference number."></i>
                    </label>
                    <input type="number" class="form-control" id="reference-number" placeholder="Optional">
                </div>
                <div class="form-group">
                    <label for="subject-alt-names">
                        Subject Alt Names
                        <i class="fas fa-info-circle" data-toggle="tooltip" title="Additional domains space separated."></i>
                    </label>
                    <input type="text" class="form-control" id="subject-alt-names" placeholder="alias1.example.com alias2.example.com">
                </div>
                <br />
                <div class="alert alert-info py-2 mt-3" style="font-size: 0.85rem;">
                    <i class="fas fa-info-circle"></i>
                    Once you receive your signed certificate from the CA, use the <strong>Import</strong> tab to import it!
                </div>
            </div>

            <!-- Import Fields -->
            <div id="import-fields" style="display: none;">
                <div class="form-group">
                    <label for="certificate">
                        Certificate
                        <i class="fas fa-info-circle" data-toggle="tooltip" title="Paste your signed PEM certificate here."></i>
                    </label>
                    <textarea class="form-control" id="certificate" rows="8" placeholder="-----BEGIN CERTIFICATE-----"></textarea>
                </div>
            </div>

            <!-- Submit -->
            <div class="mt-auto pt-3">
                <button id="submit-btn" class="btn">
                    <i class="fas fa-play"></i> Run: Build
                </button>
            </div>

        </div>

        <!-- Right Pane: Output -->
        <div id="output-pane">
            <div class="status-bar">
                <h5><i class="fas fa-lock"></i> SSL Management Console &nbsp;|&nbsp; <i class="fas fa-terminal"></i> Output</h5>
                <div>
                    <span id="status-badge" class="badge badge-secondary">Idle</span>
                    <a href="./swagger" target="_blank" class="btn btn-sm btn-info ml-2" style="text-decoration: none; border: 1px solid #6c757d;">
                        {} api
                    </a>
                    <button id="clear-btn" class="btn btn-sm btn-outline-secondary ml-2">
                        <i class="fas fa-trash"></i> Clear
                    </button>
                </div>
            </div>
            <textarea id="output-area" readonly placeholder="Output will appear here..."></textarea>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function () {

            const TIMEOUT_MS = 300000; // 5 minutes
            let currentAction = 'build';
            let requestTimeout = null;

            // Init tooltips
            $('[data-toggle="tooltip"]').tooltip();

            // --- Tab switching ---
            $('#action-tabs .nav-link').on('click', function (e) {
                e.preventDefault();
                $('#action-tabs .nav-link').removeClass('active');
                $(this).addClass('active');

                currentAction = $(this).data('action');
                $('#submit-btn').html('<i class="fas fa-play"></i> Run: ' + capitalise(currentAction));

                $('#build-fields').toggle(currentAction === 'build' || currentAction === 'selfsign');
                $('#reference-number').closest('.form-group').toggle(currentAction === 'build');
                $('#import-fields').toggle(currentAction === 'import');

                clearOutput();
            });

            // --- Submit ---
            $('#submit-btn').on('click', function () {
                const token       = $('#netbox-token').val().trim();
                const common_name = $('#common-name').val().trim().toLowerCase();

                if (!token) {
                    showOutput('ERROR: NetBox API token is required.');
                    return;
                }

                if (!common_name) {
                    showOutput('ERROR: Common Name is required.');
                    return;
                }

                let payload  = { common_name: common_name };
                let endpoint = './api/' + currentAction;

                if (currentAction === 'build' || currentAction === 'selfsign') {
                    const owner_group = $('#owner-group').val().trim();
                    if (!owner_group) {
                        showOutput('ERROR: Owner Group is required.');
                        return;
                    }
                    payload.owner_group = owner_group;

                    if (currentAction === 'build') {
                        const ref = $('#reference-number').val().trim();
                        if (ref) payload.reference_number = ref;
                    }

                    const sans = $('#subject-alt-names').val().trim();
                    if (sans) payload.subject_alt_names = sans.split(/\s+/);
                }

                if (currentAction === 'import') {
                    const cert = $('#certificate').val().trim();
                    if (!cert) {
                        showOutput('ERROR: Certificate is required.');
                        return;
                    }
                    payload.certificate = cert;
                }

                runRequest(endpoint, token, payload);
            });

            // --- Clear button ---
            $('#clear-btn').on('click', function () {
                clearOutput();
            });

            // --- API Request ---
            function runRequest(endpoint, token, payload) {
                setLoading(true, 'Running ' + capitalise(currentAction) + '...');
                clearOutput();
                setStatus('Running', 'warning');

                requestTimeout = setTimeout(function () {
                    setLoading(false);
                    setStatus('Timeout', 'danger');
                    showOutput('ERROR: Request timed out after 5 minutes.');
                }, TIMEOUT_MS);

                fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type':  'application/json',
                        'Authorization': 'Bearer ' + token,
                        'Accept': 'text/plain',
                    },
                    body: JSON.stringify(payload),
                })
                .then(function (response) {
                    return response.text().then(function (data) {
                       return { status: response.status, data: data };
                    });
                })
                .then(function (result) {
                    clearTimeout(requestTimeout);
                    setLoading(false);

                    if (result.status === 200) {
                        setStatus('Success', 'success');
                    } else {
                        setStatus('Error ' + result.status, 'danger');
                    }

                    $('#output-area').val(result.data);
                })
                .catch(function (error) {
                    clearTimeout(requestTimeout);
                    setLoading(false);
                    setStatus('Error', 'danger');
                    showOutput('ERROR: ' + error.message);
                });
            }

            // --- Helpers ---
            function setLoading(active, message) {
                if (active) {
                    $('#overlay-message').text(message || 'Running...');
                    $('#form-overlay').addClass('active');
                    $('#submit-btn').prop('disabled', true);
                } else {
                    $('#form-overlay').removeClass('active');
                    $('#submit-btn').prop('disabled', false);
                }
            }

            function setStatus(text, type) {
                const badge = $('#status-badge');
                badge.text(text);
                badge.attr('class', 'badge badge-' + type);
            }

            function showOutput(text) {
                $('#output-area').val(text);
            }

            function clearOutput() {
                $('#output-area').val('');
                setStatus('Idle', 'secondary');
            }

            function capitalise(str) {
                return str.charAt(0).toUpperCase() + str.slice(1);
            }

        });
    </script>

</body>
</html>
